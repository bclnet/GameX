# Mirage reviews a family by opening the asset itself. Refresh /mcps after this file changes.
# The frame is also written under %TEMP%\gamex-mirage so a truncated tool result still leaves a PNG.

[mcp]
max_output_bytes = 2000000

[mcp_servers.mirage]
command = "dotnet"
args = ["exec", "F:/_GITHUB/bclnet/GameX/dotnet/Core/GameX.Mcp/bin/Debug/net10.0/GameX.Mcp.dll"]
cwd = "F:/_GITHUB/bclnet/GameX"
enabled = true
startup_timeout_sec = 90
tool_timeout_sec = 180
expose_image_base64 = true
