[workspace]
resolver = "2"

members = [
    "aix/aix",
    "core/openx",
    "core/poly",
    "gfx/gfx",
    "gfx/gfx-egin",
    "gfx/gfx-other",
    "phy/phy",
    "engines/eginx",
    "engines/godot",
    "engines/mg",
    "engines/o3de",
    "engines/ogre",
    "engines/opengl",
    "engines/sdl",
    "engines/stride",
    "engines/tests",
    "engines/unity",
    "engines/unreal",
    "engines/vk",
    "engines/wpf-control",
    "engines/wpf-stride",
    "sfx/sfx",
    "sfx/sfx-al",
    "sfx/sfx-ogg",
    "vfx/vfx",
    "vfx/vfx-program",
]

[workspace.package]
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
bytemuck = { version = "1", features = ["derive"] }
byteorder = "1"
glam = { version = "0.29", features = ["bytemuck"] }
half = "2"
thiserror = "1"
bitflags = "2"

[profile.release]
lto = true
codegen-units = 1
