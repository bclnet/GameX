[package]
name = "openx-engine-unreal"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Off by default. Defines GAMEX_WITH_UNREAL for native/unreal_shim.cpp.
# Needs an Unreal Engine install this repo does not have, so it is not a CI default.
unreal = []

[dependencies]
openx = { path = "../../core/openx" }
openx-gfx = { path = "../../gfx/gfx" }

[build-dependencies]
cc = "1"
