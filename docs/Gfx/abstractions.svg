  <text x="24" y="592" font-size="16" font-weight="600">What stays separate</text>
  <g transform="translate(24,608)">
    <rect width="280" height="88" fill="#fff" stroke="#1b7f4e"/>
    <text x="12" y="22" font-weight="600">ISprite</text>
    <text x="12" y="42">One image. Width, height, Create.</text>
    <text x="12" y="62">Shared by both sprite slots.</text>
    <text x="12" y="78" fill="#444">OpenX.Gfx</text>

    <rect x="300" width="300" height="88" fill="#fff" stroke="#1b7f4e"/>
    <text x="312" y="22" font-weight="600">Sprite slot and SpriteAlt slot</text>
    <text x="312" y="42">Same pixels. Different attachment.</text>
    <text x="312" y="62">Canvas sprite, or a billboard in 3D.</text>
    <text x="312" y="78" fill="#444">Keep both. GfX.XSprite and XSpriteAlt.</text>

    <rect x="620" width="300" height="88" fill="#fff" stroke="#8a3a2a"/>
    <text x="632" y="22" font-weight="600">TextureSequences</text>
    <text x="632" y="42">Valve particle UV frames.</text>
    <text x="632" y="62">Not a pivot, not a pixel rect.</text>
    <text x="632" y="78" fill="#444">Stays. Not the GfxSpriteSheet.</text>
  </g>

  <text x="24" y="732" font-size="16" font-weight="600">Atlas, off the slot grid</text>
  <rect x="24" y="744" width="896" height="78" fill="#fff" stroke="#c47b00"/>
  <text x="36" y="766" font-weight="600">GfxSpriteSheet</text>
  <text x="36" y="786">In OpenX.Gfx. Frame and Anim are nested. IOpenGfxSprite.Frame(texture, sheet, index) returns one cell.</text>
  <text x="36" y="806" fill="#444">Usage rank is in this folder's gfx.svg. EginX is ours. Stride is the weakest host the Explorer still lists.</text>
</svg>
