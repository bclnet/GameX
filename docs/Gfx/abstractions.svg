<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 860" font-family="Segoe UI, sans-serif" font-size="13">
  <title>OpenX Gfx slots and sprite decisions</title>
  <desc>Which engines fill GfxFactory slots. Sprite and SpriteAlt stay separate from TextureSequences.</desc>
  <rect width="980" height="860" fill="#f7f6f3"/>
  <text x="24" y="32" font-size="18" font-weight="600">Gfx factory slots</text>
  <text x="24" y="52" fill="#444">Order: API, Sprite, SpriteAlt, Model, Light, Terrain. See docs/Gfx/Design.md.</text>

  <rect x="24" y="68" width="14" height="14" fill="#1b7f4e"/>
  <text x="44" y="80">live: manager is constructed</text>
  <rect x="250" y="68" width="14" height="14" fill="#c47b00"/>
  <text x="270" y="80">shell: class registered, manager not built</text>
  <rect x="560" y="68" width="14" height="14" fill="#d9d6d0"/>
  <text x="580" y="80">empty slot</text>
  <rect x="680" y="68" width="14" height="14" fill="#4a6fa5"/>
  <text x="700" y="80">registered, not a sprite slot</text>


