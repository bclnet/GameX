<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1140" font-family="Segoe UI, sans-serif" font-size="13">
  <title>OpenX Gfx types</title>
  <desc>Api, GfxModel, Shader, Sprite, SpriteAlt, Texture, Material, Terrain, GfxSpriteSheet with nested Frame and Anim, GfxUnknown, and the engine usage rank.</desc>
  <rect width="1100" height="1140" fill="#f7f6f3"/>
  <text x="24" y="32" font-size="18" font-weight="600">OpenX.Gfx</text>
  <text x="24" y="52" fill="#444">Sprite and SpriteAlt are the slots. GfxSpriteSheet is the atlas. Frame and Anim sit on the sheet. See docs/Gfx/Design.md.</text>

  <rect x="24" y="68" width="14" height="14" fill="#1b7f4e"/>
  <text x="44" y="80">in Gfx now</text>
  <rect x="160" y="68" width="14" height="14" fill="#8a3a2a"/>
  <text x="180" y="80">TextureSequences, separate</text>
  <rect x="400" y="68" width="14" height="14" fill="#f4f3f1" stroke="#888"/>
  <text x="420" y="80">parked</text>

  <!-- row 1 -->
  <g transform="translate(24,108)">
    <rect width="200" height="110" fill="#fff" stroke="#1b7f4e"/>
    <text x="12" y="22" font-weight="600">Api</text>
    <text x="12" y="44">IOpenGfxApi</text>
    <text x="12" y="64">Objects, meshes, transforms.</text>
    <text x="12" y="84" fill="#444">GfxFactory slot 0</text>

    <rect x="216" width="200" height="110" fill="#fff" stroke="#1b7f4e"/>
    <text x="228" y="22" font-weight="600">GfxModel</text>
    <text x="228" y="44">IGfxModel</text>
    <text x="228" y="64">Builder and manager.</text>
    <text x="228" y="84" fill="#444">Mesh path. Factory slot stays Model.</text>

    <rect x="432" width="200" height="110" fill="#fff" stroke="#1b7f4e"/>
    <text x="444" y="22" font-weight="600">Shader</text>
    <text x="444" y="44">GfxShader</text>
    <text x="444" y="64">ShaderBuilder, ShaderManager.</text>
    <text x="444" y="84" fill="#444">No factory slot of its own.</text>

    <rect x="648" width="200" height="110" fill="#fff" stroke="#1b7f4e"/>
    <text x="660" y="22" font-weight="600">Texture</text>
    <text x="660" y="44">ITexture, ITextureFrames</text>
    <text x="660" y="64">TextureBuilder, TextureManager.</text>
    <text x="660" y="84" fill="#444">Frames are a flipbook.</text>

    <rect x="864" width="200" height="110" fill="#fff" stroke="#1b7f4e"/>
    <text x="876" y="22" font-weight="600">Material</text>
    <text x="876" y="44">IMaterial</text>
    <text x="876" y="64">MaterialBuilder, MaterialManager.</text>
    <text x="876" y="84" fill="#444">Holds textures.</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(24,234)">
    <rect width="250" height="120" fill="#fff" stroke="#1b7f4e"/>
    <text x="12" y="22" font-weight="600">Sprite</text>
    <text x="12" y="44">Majority of sprites.</text>
    <text x="12" y="64">GfX.XSprite, slot 1.</text>
    <text x="12" y="84">ISprite, SpriteBuilder, SpriteManager.</text>
    <text x="12" y="104" fill="#444">Mirage live. Five shells. Rank table below.</text>

    <rect x="266" width="250" height="120" fill="#fff" stroke="#1b7f4e"/>
    <text x="278" y="22" font-weight="600">SpriteAlt</text>
    <text x="278" y="44">Billboard or quad.</text>
    <text x="278" y="64">GfX.XSpriteAlt, slot 2.</text>
    <text x="278" y="84">Same ISprite. Different attachment.</text>
    <text x="278" y="104" fill="#444">Mirage live. Rank table below.</text>

    <rect x="532" width="250" height="120" fill="#fff" stroke="#1b7f4e"/>
    <text x="544" y="22" font-weight="600">Terrain</text>
    <text x="544" y="44">IOpenGfxTerrain</text>
    <text x="544" y="64">GfxTerrainLayer.</text>
    <text x="544" y="84" fill="#444">GfxFactory slot 5.</text>

    <rect x="798" width="266" height="120" fill="#fff" stroke="#1b7f4e"/>
    <text x="810" y="22" font-weight="600">Light</text>
    <text x="810" y="44">IOpenGfxLight</text>
    <text x="810" y="64">Already a slot.</text>
    <text x="810" y="84" fill="#444">GfxFactory slot 4.</text>
  </g>

  <!-- GfxSpriteSheet: Frame and Anim are nested -->
  <g transform="translate(24,370)">
    <rect width="700" height="156" fill="#fff" stroke="#1b7f4e"/>
    <text x="12" y="22" font-weight="600">GfxSpriteSheet</text>
    <text x="148" y="22" fill="#444">atlas. Texture plus the two nested types.</text>
    <rect x="12" y="36" width="220" height="72" fill="#f3f7f4" stroke="#1b7f4e"/>
    <text x="22" y="54" font-weight="600">Frame</text>
    <text x="22" y="74">x, y, width, height</text>
    <text x="22" y="92" fill="#444">pivot 0..1, duration</text>
    <rect x="244" y="36" width="200" height="72" fill="#f3f7f4" stroke="#1b7f4e"/>
    <text x="254" y="54" font-weight="600">Anim</text>
    <text x="254" y="74">name</text>
    <text x="254" y="92" fill="#444">indexes into Frames</text>
    <text x="460" y="54" font-weight="600">Texture</text>
    <text x="460" y="74">the packed image</text>
    <text x="460" y="94" fill="#444">already uploaded</text>
    <text x="12" y="128">Frame(texture, sheet, index) returns the host sprite and one Frame.</text>
    <text x="12" y="146" fill="#444">Rust has no nested class: GfxSpriteSheetFrame and GfxSpriteSheetAnim.</text>
  </g>
  <g transform="translate(740,370)">
    <rect width="324" height="156" fill="#f4f3f1" stroke="#888"/>
    <text x="12" y="22" font-weight="600">GfxUnknown</text>
    <text x="12" y="46">Parked scene-node loader.</text>
    <text x="12" y="66">Create returns B_Object.</text>
    <text x="12" y="86">Instance parents that node.</text>
    <text x="12" y="110" fill="#444">No engine constructs it.</text>
    <text x="12" y="130" fill="#444">Was ObjectSprite.</text>
  </g>

  <!-- TextureSequences -->
  <rect x="24" y="542" width="1040" height="72" fill="#fff" stroke="#8a3a2a"/>
  <text x="36" y="564" font-weight="600">TextureSequences</text>
  <text x="36" y="586">Stays in OpenX.Gfx. Valve GetSpriteSheetData fills it. The OpenGL particle renderer reads it. UV images and particle flags.</text>
  <text x="36" y="604" fill="#444">Separate from GfxSpriteSheet. Moving it into GameX.Valve would make the OpenGL engine depend on a family.</text>

  <text x="24" y="640" font-size="16" font-weight="600">How the engines are used</text>
  <text x="24" y="658" fill="#444">A lower rank is a host something already opens. EginX is ours. Stride stays. Slot fill is in docs/Gfx/abstractions.svg.</text>

  <g transform="translate(24,672)" font-size="12">
    <rect width="1052" height="26" fill="#eceae4"/>
    <text x="8" y="17" font-weight="600">Rank</text>
    <text x="44" y="17" font-weight="600">Engine</text>
    <text x="280" y="17" font-weight="600">Id</text>
    <text x="390" y="17" font-weight="600">Where it is used</text>
    <text x="890" y="17" font-weight="600">Sheet</text>

    <g transform="translate(0,26)">
      <rect width="1052" height="24" fill="#fff"/>
      <text x="8" y="16">1</text><text x="44" y="16">OpenGL</text><text x="280" y="16">GL</text>
      <text x="390" y="16">C# and Rust Explorer. Rust draws Arx. App.Client -e GL is MonoGame.</text>
      <text x="890" y="16">texture id + cell</text>
    </g>
    <g transform="translate(0,50)">
      <rect width="1052" height="24" fill="#f7f6f3"/>
      <text x="8" y="16">2</text><text x="44" y="16">MonoGame</text><text x="280" y="16">MG</text>
      <text x="390" y="16">App.Client default. Plays Origin UO through GumpArt.</text>
      <text x="890" y="16">texture + cell</text>
    </g>
    <g transform="translate(0,74)">
      <rect width="1052" height="24" fill="#fff"/>
      <text x="8" y="16">3</text><text x="44" y="16">Mirage</text><text x="280" y="16">MR</text>
      <text x="390" y="16">Headless tests. Both sprite slots construct SpriteManager.</text>
      <text x="890" y="16">picture + cell</text>
    </g>
    <g transform="translate(0,98)">
      <rect width="1052" height="24" fill="#f7f6f3"/>
      <text x="8" y="16">4</text><text x="44" y="16">Unity</text><text x="280" y="16">UN</text>
      <text x="390" y="16">Explorer. Shell player runs. Sprite managers are not built.</text>
      <text x="890" y="16">Sprite.Create</text>
    </g>
    <g transform="translate(0,122)">
      <rect width="1052" height="24" fill="#fff"/>
      <text x="8" y="16">5</text><text x="44" y="16">Vulkan</text><text x="280" y="16">VK</text>
      <text x="390" y="16">Explorer. The view presents. Sprite manager is not built.</text>
      <text x="890" y="16">texture + cell</text>
    </g>
    <g transform="translate(0,146)">
      <rect width="1052" height="24" fill="#e7f0fa"/>
      <text x="8" y="16">6</text><text x="52" y="16" font-weight="600">EginX</text><text x="280" y="16">EX</text>
      <text x="390" y="16">Ours. App.Client -e EX. Python Explorer.</text>
      <text x="890" y="16">texture + cell</text>
    </g>
    <g transform="translate(0,170)">
      <rect width="1052" height="24" fill="#fff"/>
      <text x="8" y="16">7</text><text x="44" y="16">Godot</text><text x="280" y="16">GD</text>
      <text x="390" y="16">Explorer. Renderer commented out. Shell pipe is in the project.</text>
      <text x="890" y="16">AtlasTexture</text>
    </g>
    <g transform="translate(0,194)">
      <rect width="1052" height="24" fill="#f8efe6"/>
      <text x="8" y="16">8</text><text x="44" y="16">Stride</text><text x="280" y="16">ST</text>
      <text x="390" y="16">Explorer NIF, FTL, FTS, BSP. Client host throws. Weakest listed.</text>
      <text x="890" y="16">texture + cell</text>
    </g>
    <g transform="translate(0,218)">
      <rect width="1052" height="24" fill="#fff"/>
      <text x="8" y="16">9</text><text x="44" y="16">SDL</text><text x="280" y="16">SD</text>
      <text x="390" y="16">Explorer. Rust backend is still a comment.</text>
      <text x="890" y="16">texture + cell</text>
    </g>
    <g transform="translate(0,242)">
      <rect width="1052" height="24" fill="#f7f6f3"/>
      <text x="8" y="16">10</text><text x="44" y="16">Ogre</text><text x="280" y="16">OG</text>
      <text x="390" y="16">Explorer calls OgreRenderer.</text>
      <text x="890" y="16">texture + cell</text>
    </g>
    <g transform="translate(0,266)">
      <rect width="1052" height="24" fill="#fff"/>
      <text x="8" y="16">11</text><text x="44" y="16">O3DE</text><text x="280" y="16">O3</text>
      <text x="390" y="16">Explorer calls O3deRenderer.</text>
      <text x="890" y="16">texture + cell</text>
    </g>
    <g transform="translate(0,290)">
      <rect width="1052" height="24" fill="#f7f6f3"/>
      <text x="8" y="16">12</text><text x="44" y="16">Unreal</text><text x="280" y="16">UR</text>
      <text x="390" y="16">Explorer. Renderer commented out. Shim is unreal-shim-stub.</text>
      <text x="890" y="16">texture + cell</text>
    </g>
    <g transform="translate(0,314)">
      <rect width="1052" height="24" fill="#fff"/>
      <text x="8" y="16">13</text><text x="44" y="16">bgfx, wgpu, Diligent, Raylib</text><text x="280" y="16">BX WG DN RL</text>
      <text x="390" y="16">Registration stubs. The C# Explorer does not list them.</text>
      <text x="890" y="16">texture + cell</text>
    </g>
    <g transform="translate(0,338)">
      <rect width="1052" height="24" fill="#f7f6f3"/>
      <text x="8" y="16">14</text><text x="44" y="16">Bevy</text><text x="280" y="16">BV</text>
      <text x="390" y="16">Rust only. No GfxFactory and no Frame.</text>
      <text x="890" y="16">none</text>
    </g>
    <g transform="translate(0,362)">
      <rect width="1052" height="24" fill="#fff"/>
      <text x="8" y="16">15</text><text x="44" y="16">Test, Unknown</text><text x="280" y="16">TT UK</text>
      <text x="390" y="16">Test throws. Unknown is six empty slots.</text>
      <text x="890" y="16">throws</text>
    </g>
  </g>

  <text x="24" y="1084" fill="#444">Unity calls Sprite.Create. Godot builds an AtlasTexture on Sprite2D and Sprite3D. The other hosts return the texture and the cell.</text>
  <text x="24" y="1104" fill="#444">Stride 4.3 already has SpriteSheet and SpriteFrame. Our atlas stays GfxSpriteSheet. Dropping Stride removes the Explorer view.</text>
  <text x="24" y="1124" fill="#444">Panda3D, PyEngine3D, and Pygame are Python only and have no Frame. Factory order stays Api, Sprite, SpriteAlt, Model, Light, Terrain.</text>
</svg>
