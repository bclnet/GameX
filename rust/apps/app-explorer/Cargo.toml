[package]
name = "gamex-app-explorer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
gamex-all = { path = "../../core/all" }
gamex-cig-explorer = { path = "../../families/cig-explorer" }
gamex-engine-godot = { path = "../../engines/engine-godot" }
gamex-engine-o3de = { path = "../../engines/engine-o3de" }
gamex-engine-ogre = { path = "../../engines/engine-ogre" }
gamex-engine-opengl = { path = "../../engines/engine-opengl" }
gamex-engine-sdl = { path = "../../engines/engine-sdl" }
gamex-engine-stride = { path = "../../engines/engine-stride" }
gamex-engine-unity = { path = "../../engines/engine-unity" }
gamex-engine-unreal = { path = "../../engines/engine-unreal" }
gamex = { path = "../../core/gamex" }
gamex-arkane = { path = "../../families/arkane" }
gamex-uncore = { path = "../../families/uncore" }
openx = { path = "../../../OpenX/rust/core/openx" }
openx-poly = { path = "../../../OpenX/rust/core/poly" }
openx-engine-godot = { path = "../../../OpenX/rust/engines/godot" }
openx-engine-o3de = { path = "../../../OpenX/rust/engines/o3de" }
openx-engine-ogre = { path = "../../../OpenX/rust/engines/ogre" }
openx-engine-opengl = { path = "../../../OpenX/rust/engines/opengl" }
openx-engine-sdl = { path = "../../../OpenX/rust/engines/sdl" }
openx-engine-stride = { path = "../../../OpenX/rust/engines/stride" }
openx-engine-unity = { path = "../../../OpenX/rust/engines/unity" }
openx-engine-unreal = { path = "../../../OpenX/rust/engines/unreal" }
openx-wpf-control = { path = "../../../OpenX/rust/engines/wpf-control" }
indexmap = "2"
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.36", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "gif"] }
rfd = "0.17"

[[bin]]
name = "gamex-app-explorer"
path = "src/main.rs"
