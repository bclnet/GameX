[package]
name = "gamex"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
openx = { path = "../../../OpenX/rust/core/openx" }
openx-gfx = { path = "../../../OpenX/rust/gfx/gfx" }
openx-poly = { path = "../../../OpenX/rust/core/poly" }
openx-vfx = { path = "../../../OpenX/rust/vfx/vfx" }
glam = { workspace = true }
indexmap = "2"
serde_json = { version = "1", features = ["preserve_order"] }
bitflags = { workspace = true }
md-5 = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
sxd-document = "0.3"
sxd-xpath = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
